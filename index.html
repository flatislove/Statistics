<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Web App</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Статистика 📊</h2>
    <p>Это интерфейс Web App, запущенный через GitHub Pages!</p>
    
    <button id="sendBtn">Отправить данные боту</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        document.getElementById("sendBtn").addEventListener("click", () => {
            // Передаем данные обратно в чат с ботом
            tg.sendData(JSON.stringify({
                status: "success",
                message: "Привет из Web App!"
            }));
        });
    </script>
</body>
</html>
