<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Day Settings - Volleyball Statistics</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Match Day Settings</h1>
        
        <button id="btn-back-to-settings" style="margin-bottom: 15px; background-color: #6c757d; color: white;">&larr; Back to Settings</button>

        <div class="card">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="format-select">Tournament Format:</label>
                    <select id="format-select" style="width: 100%; padding: 8px; margin-top: 5px;">
                        <option value="round_robin">Round Robin</option>
                        <option value="playoff">Playoff</option>
                        <option value="friendly">Friendly</option>
                    </select>
                </div>
                
                <div>
                    <label for="target-wins-select">Target Wins (Sets):</label>
                    <select id="target-wins-select" style="width: 100%; padding: 8px; margin-top: 5px;">
                        <option value="1">1 Set</option>
                        <option value="2">Best of 3 (2 Wins)</option>
                        <option value="3">Best of 5 (3 Wins)</option>
                    </select>
                </div>

                <button id="btn-save-settings" style="background-color: #2481cc; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">Save Settings</button>
            </div>
        </div>
    </div>

    <script type="module" src="./static/js/match_day_settings.js"></script>
</body>
</html>
