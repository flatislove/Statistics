<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Statistics</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Volleyball Statistics</h1>
        
        <div class="card">
            <h2>Select Community</h2>
            <div id="communities-list">Loading communities...</div>
        </div>

        <div id="admin-section" class="card" style="display: none;">
            <h2>Control Panel</h2>
            <button id="btn-create-community">Create Community</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();

            const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

            if (userId) {
                alert("Success! Your Telegram ID: " + userId);
            } else {
                alert("Error: Telegram ID not found. Make sure you open the page via the bot button.");
            }
        });
    </script>

    <script type="module" src="./static/js/index.js"></script>
</body>
</html>
