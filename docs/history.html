<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Volleyball Statistics</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>History & Match Days</h1>
        
        <button id="btn-back-to-settings" style="margin-bottom: 15px; background-color: #6c757d; color: white;">&larr; Back to Settings</button>

            <div id="history-container">
                <p>History logs will be displayed here.</p>
            </div>
        </div>
    </div>

    <script type="module" src="./static/js/history.js"></script>
