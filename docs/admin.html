<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Admin Panel</h1>
            <a href="index.html" style="text-decoration: none; font-size: 14px;">← Back</a>
        </div>
        
        <!-- Блок статуса администратора -->
        <div id="admin-status" style="margin-bottom: 10px; font-weight: bold;">Checking access...</div>

        <!-- Форма создания комьюнити (по умолчанию скрыта до проверки) -->
        <div class="card" id="admin-card" style="display: none;">
            <h2>Create New Community</h2>
            <form id="create-community-form">
                <input type="text" id="community-name" placeholder="Community Name" required>
                <input type="text" id="invite-code" placeholder="Unique code (slug)" required>
                <button type="submit" id="btn-submit">Create Community</button>
            </form>
            <div id="message" style="margin-top: 10px;"></div>
        </div>

        <div class="card">
            <h2>Communities List</h2>
            <div id="communities-list">Loading...</div>
        </div>
    </div>

    <script type="module" src="./static/js/admin.js"></script>
</body>
</html>
