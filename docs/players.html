<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - Volleyball Statistics</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Players Management</h1>
        
        <button onclick="window.location.href='settings.html'" style="margin-bottom: 15px; background-color: #6c757d; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; cursor: pointer; font-size: 16px;">&larr; Back to Settings</button>

        <div class="card">
            <h2>Add Players</h2>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;">
                <input type="text" id="input-player-first-name" placeholder="Player first name" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                <input type="text" id="input-player-username" placeholder="Telegram username (optional)" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                <input type="number" id="input-player-telegram-id" placeholder="Telegram ID (optional)" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                <select id="select-player-gender" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; background-color: white; color: black;">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
                <button id="btn-add-player" style="padding: 12px; cursor: pointer; font-size: 16px; background-color: #2481cc; color: white; border: none; border-radius: 6px;">Add Player</button>
            </div>
        </div>

        <div class="card">
            <h2>Edit & Delete Players</h2>
            <div id="players-list">Loading players...</div>
        </div>
    </div>

    <div id="edit-player-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="margin-top: 0; margin-bottom: 15px;">Edit Player</h2>
            <input type="hidden" id="edit-player-id">
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;">
                <input type="text" id="input-edit-player-first-name" placeholder="Player first name" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                <input type="text" id="input-edit-player-username" placeholder="Telegram username (optional)" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                <input type="number" id="input-edit-player-telegram-id" placeholder="Telegram ID (optional)" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                <select id="select-edit-player-gender" style="width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; background-color: white; color: black;">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-save-player" style="flex: 1; padding: 12px; cursor: pointer; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 6px;">Save</button>
                    <button id="btn-cancel-edit" style="padding: 12px; cursor: pointer; font-size: 16px; background-color: #6c757d; color: white; border: none; border-radius: 6px;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./static/js/players.js?v=5"></script>
</body>
</html>
